    function goToScreen(screenNum) {
      if (screenNum < 1 || screenNum > totalScreens) return;
      activeScreen = screenNum;

      document.querySelectorAll('.stepper-chip').forEach((chip, idx) => {
        chip.classList.toggle('active', idx + 1 === screenNum);
      });

      const meta = screenMeta[screenNum - 1];
      document.getElementById('tour-counter').innerText = `Step ${screenNum} of ${totalScreens}:`;
      document.getElementById('tour-desc').innerText = meta.title;
      document.getElementById('browser-url-path').innerText = meta.url;
      document.getElementById('browser-tab-title').innerText = meta.tabTitle;

      document.getElementById('next-btn-text').innerText = (screenNum === totalScreens) ? "Restart Tour 🔄" : "Next Step";

      renderScreen(screenNum);
      document.getElementById('viewport-canvas').scrollTop = 0;
    }

    function nextScreen() {
      if (activeScreen === totalScreens) {
        goToScreen(1);
      } else {
        goToScreen(activeScreen + 1);
      }
    }

    function prevScreen() {
      if (activeScreen > 1) {
        goToScreen(activeScreen - 1);
      }
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');

      let iconColor = 'text-emerald-600 bg-emerald-50';
      let iconSvg = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;

      if (type === 'info') {
        iconColor = 'text-sky-600 bg-sky-50';
        iconSvg = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
      } else if (type === 'warning') {
        iconColor = 'text-amber-600 bg-amber-50';
        iconSvg = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>`;
      }

      toast.className = `pointer-events-auto bg-white border border-slate-200 shadow-xl rounded-xl p-3.5 flex items-center space-x-3 text-xs font-semibold text-slate-800 transition-all duration-300 transform translate-y-2 opacity-0`;
      toast.innerHTML = `
        <div class="w-6 h-6 rounded-lg ${iconColor} flex items-center justify-center shrink-0">
          ${iconSvg}
        </div>
        <div>${message}</div>
      `;

      container.appendChild(toast);
      setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-x-4');
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

      expandedQuestions[id] = !expandedQuestions[id];

    function renderFilterTabs() {
      const allCount = state.requirements.length;
      const pendingCount = state.requirements.filter(r => r.filterCategory === 'pending').length;
      const qsaApprovedCount = state.requirements.filter(r => r.filterCategory === 'qsa_approved').length;

      const modCount = state.requirements.filter(r => r.filterCategory === 'mod_requested').length;
      const inProgCount = state.requirements.filter(r => r.filterCategory === 'in_progress').length;
      const disCount = state.requirements.filter(r => r.filterCategory === 'disapproved').length;

      const tabs = [
        { key: 'all', label: 'All Controls', count: allCount },
        { key: 'pending', label: 'Pending Submission', count: pendingCount },
        { key: 'qsa_approved', label: 'QSA Approved', count: qsaApprovedCount },
        { key: 'qa_approved', label: 'QA Approved', count: qaApprovedCount },
        { key: 'mod_requested', label: 'Modification Requested', count: modCount },
        { key: 'in_progress', label: 'In Progress', count: inProgCount },
        { key: 'disapproved', label: 'Disapproved / Incomplete', count: disCount },
      ];

      return `
        <div class="flex flex-wrap gap-2 mb-6">
          ${tabs.map(t => {
        const isActive = selectedFilter === t.key;
        return `
              <button onclick="setFilter('${t.key}')" class="px-3.5 py-2 rounded-xl text-xs font-semibold transition flex items-center space-x-2 ${isActive
            ? 'bg-sky-600 text-white font-bold shadow-xs'
            : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'
          }">
                <span>${t.label}</span>
                <span class="px-1.5 py-0.5 rounded-md text-[10px] font-bold ${isActive ? 'bg-sky-700/80 text-white' : 'bg-slate-100 text-slate-500'
          }">${t.count}</span>
              </button>
            `;
      }).join('')}
        </div>
      `;
    }

              <select class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl font-semibold text-slate-800">
                <option>Acme Financial Services — CDE</option>
              </select>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block font-bold text-slate-700 uppercase tracking-wider mb-1">Lead QSA</label>
                <select class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl font-semibold text-slate-800">
                  <option>Alex Sterling (QSA)</option>
                </select>
              </div>
              <div>
                <label class="block font-bold text-slate-700 uppercase tracking-wider mb-1">QA Auditor</label>
                <select class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl font-semibold text-slate-800">
                  <option>Sarah Jenkins (QA)</option>
                </select>
              </div>
            </div>
            <div class="pt-3 flex justify-end space-x-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 text-slate-700 font-semibold rounded-xl hover:bg-slate-200">Cancel</button>
              <button type="submit" class="px-4 py-2 bg-sky-600 text-white font-bold rounded-xl hover:bg-sky-700 shadow-xs">Create Engagement Mapping</button>
            </div>
          </form>
        </div>
      `);
    }

    function handleCreateProjectSubmit(e) {
      e.preventDefault();
      closeModal();
      showToast('Compliance Project Mapped across all 5 roles!', 'success');
      renderScreen(4);
    }

    // Evidence Submission
    function handleEvidenceSubmit(reqId) {
      const noteInput = document.getElementById(`evidence-note-${reqId}`);
      const req = state.requirements.find(r => r.id === reqId);
      if (req) {
        req.evidenceFiles.push({
          id: `doc-${Date.now()}`,
          name: `uploaded_evidence_${reqId}_signed.pdf`,
          size: '1.9 MB',
          uploadedBy: 'David Miller (Customer)',
          uploadDate: 'Just now'
        });
        showToast(`Evidence artifact added to Req ${reqId} Tracker!`, 'success');
        if (noteInput) noteInput.value = '';
        renderScreen(5);
      }
    }

    // Post Discussion Message
    function postDiscussionComment() {
      const input = document.getElementById('chat-input');
      if (!input || !input.value.trim()) return;

      state.comments.push({
        id: `c-${Date.now()}`,
        user: 'David Miller',
        role: 'Customer',
        roleBadge: 'bg-sky-50 text-sky-700',
        text: input.value.trim(),
        time: 'Just now'
      });

      input.value = '';
      showToast('Comment recorded to audit thread', 'success');
      renderScreen(5);
    }

    // QSA Batch Accept
    function qsaBatchAcceptAll() {
      state.requirements.forEach(r => {
        r.filterCategory = 'qa_approved';
        r.allStatus = 4;
        r.badge = 'Assigned to QA';
        r.badgeClass = 'bg-indigo-50 text-indigo-700 border-indigo-200';
      });
      showToast('All requirements accepted by QSA and assigned to QA!', 'success');
      renderScreen(7);
    }

    // QA Batch Approve
    function qaApproveAllRequirements() {
      state.requirements.forEach(r => {
        r.filterCategory = 'qa_approved';
        r.allStatus = 4;
        r.badge = 'QA Approved';
        r.badgeClass = 'bg-emerald-50 text-emerald-700 border-emerald-200';
      });
      state.projects[0].progress = 100;
      showToast('All requirements QA Verified and Approved!', 'success');
      renderScreen(8);
    }

    // Admin Upload ROC / AOC
    function simulateUploadRoc() {
      state.uploadedRoc = true;
      showToast('Signed ROC Document uploaded and validated!', 'success');
      renderScreen(9);
    }

    function simulateUploadAoc() {
      state.uploadedAoc = true;
      showToast('Signed AOC Attestation uploaded and recorded!', 'success');
      renderScreen(9);
    }

    function publishFinalReports() {
      state.uploadedRoc = true;
      state.uploadedAoc = true;
      showToast('Official ROC and AOC published to customer repository!', 'success');
      goToScreen(10);
    }

    // Evidence Export Modal (Exact match of EvidenceExportModal.tsx)
    function openEvidenceExportModal() {
      openModal(`
        <div class="p-6">
          <div class="flex justify-between items-center mb-4">
            <div class="flex items-center space-x-2">
              <span class="text-xl">📦</span>
              <h3 class="text-base font-bold text-slate-900">Export Compliance Evidence Package</h3>
            </div>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
          </div>
          <p class="text-xs text-slate-500 mb-4">Download a structured, audit-ready ZIP archive of all evidence documents, assessor working papers, and signed reports with cryptographic SHA-256 manifest.</p>
          
          <div class="bg-slate-900 text-slate-200 rounded-xl p-3.5 font-mono text-[11px] mb-4 space-y-1">
            <div class="text-sky-400 font-bold">📂 PCI-DSS-4.0_AcmeCorp_Evidence/</div>
            <div class="text-slate-400 pl-4">├── 📄 manifest.json (SHA-256 Checksums)</div>
            <div class="text-slate-400 pl-4">├── 📁 Req_1.1_Firewall_Standards/ (${state.requirements[0].evidenceFiles.length} Evidence Docs)</div>
            <div class="text-slate-400 pl-4">├── 📁 Req_1.2_Rule_Configurations/ (${state.requirements[1].evidenceFiles.length} Evidence Docs)</div>
            <div class="text-slate-400 pl-4">└── 📁 Reports/ (AOC_Signed.pdf, ROC_Comprehensive.pdf)</div>
          </div>

          <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs mb-4">
            <span class="text-slate-600">Audit Package Size: <strong>14.8 MB</strong></span>
            <span class="text-emerald-700 font-bold">✓ EvidenceDownloadLog Recorded</span>
          </div>

          <div class="flex justify-end space-x-2">
            <button onclick="closeModal()" class="px-4 py-2 bg-slate-100 text-slate-700 font-semibold rounded-xl hover:bg-slate-200 text-xs">Cancel</button>
            <button onclick="downloadZipManifest()" class="px-4 py-2 bg-sky-600 text-white font-bold rounded-xl hover:bg-sky-700 shadow-xs text-xs flex items-center space-x-1.5">
              <span>Download Audit ZIP</span>
            </button>
          </div>
        </div>
      `);
    }

    function downloadZipManifest() {
      closeModal();
      showToast('Compiling Excel matrix and streaming ZIP package...', 'info');
      setTimeout(() => {
        const manifestData = {
          auditProject: "Acme Financial Services - PCI-DSS 4.0",
          status: "Certified",
          leadQsa: "Alex Sterling",
          qaDirector: "Sarah Jenkins",
          date: new Date().toISOString(),
          requirementsCount: state.requirements.length,
          files: state.requirements.flatMap(r => r.evidenceFiles.map(f => ({ req: r.id, file: f.name, size: f.size })))
        };
        const blob = new Blob([JSON.stringify(manifestData, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'Compliance_Evidence_Package_AcmeCorp_Manifest.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('✅ Compliance ZIP & Manifest downloaded successfully!', 'success');
      }, 700);
    }

    window.addEventListener('DOMContentLoaded', () => {
      goToScreen(1);
    });
  </script>
</body>

</html>
